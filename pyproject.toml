[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copula-tail-stress"
version = "0.1.0"
description = "Matched-rank copula tail stress with quadrature references and binomial Monte Carlo uncertainty"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "scipy==1.15.3"]
license = "MIT"

[project.scripts]
copula-tail-audit = "copula_stress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
