name: tests-and-example

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install and verify dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps .
          python -m pip check
      - name: Test logic and installed CLI
        run: python -m pytest -q
      - name: Reproduce full synthetic experiment
        run: python examples/demo.py --output /tmp/copula-tail-stress-results
      - name: Exercise command line
        run: copula-tail-audit --family gaussian --q 0.99 --n 20000
